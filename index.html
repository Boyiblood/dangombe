function loadMyScoreSheet() {
  const cls = document.getElementById('ms_class').value;
  const arm = document.getElementById('ms_arm').value;
  const subj = document.getElementById('ms_subject').value;
  const list = studentsIn(cls, arm);
  const existing = {};
  DB.scores.filter(s => s.session === DB.settings.session && s.term === DB.settings.term && s.class === cls && s.arm === arm && s.subject === subj)
    .forEach(s => existing[s.admissionNo] = s);
  
  const approvalKey = DB.settings.session + '|' + DB.settings.term + '|' + cls + '|' + arm + '|' + subj;
  const isApproved = DB.scoreApprovals && DB.scoreApprovals[approvalKey] && DB.scoreApprovals[approvalKey].approved;
  const canEdit = !isApproved;
  const editable = canEdit ? '' : 'disabled';
  const warn = isApproved ? '<div class="warn-box">⚠️ These scores have been approved and cannot be edited.</div>' : '';
  
  document.getElementById('myScoreSheetPanel').innerHTML = `
    <h3>${cls} ${arm || ''} — ${DB.subjects.find(s => s.code === subj)?.name || subj}</h3>
    ${warn}
    <div class="table-wrap"><table><thead><tr><th>Adm</th><th>Student</th><th>CA1</th><th>CA2</th><th>CA3</th><th>Exam</th><th>Total</th><th>Grade</th></tr></thead>
    <tbody>
    ${list.map(s => {
      const e = existing[s.admissionNo] || {};
      return `<tr data-adm="${s.admissionNo}">
        <td>${esc(s.admissionNo)}</td><td>${esc(s.firstName)} ${esc(s.surname)}</td>
        <td><input type="number" min="0" max="10" value="${e.ca1 ?? ''}" style="width:50px" onchange="calcMyRow(this)" ${editable}></td>
        <td><input type="number" min="0" max="10" value="${e.ca2 ?? ''}" style="width:50px" onchange="calcMyRow(this)" ${editable}></td>
        <td><input type="number" min="0" max="10" value="${e.ca3 ?? ''}" style="width:50px" onchange="calcMyRow(this)" ${editable}></td>
        <td><input type="number" min="0" max="${DB.settings.examMax}" value="${e.exam ?? ''}" style="width:50px" onchange="calcMyRow(this)" ${editable}></td>
        <td class="totalCell">${e.total ?? '-'}</td><td class="gradeCell">${e.grade ?? '-'}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="8" class="empty">No students.</td></tr>`}
    </tbody></table></div>
    ${list.length && canEdit ? `<button class="btn" style="margin-top:12px" onclick="saveMyScoreSheet('${cls}','${arm}','${subj}')">Save Scores</button>` : ''}
  `;
}

function calcMyRow(input) {
  const tr = input.closest('tr');
  const ca1 = Number(tr.children[2].querySelector('input').value || 0);
  const ca2 = Number(tr.children[3].querySelector('input').value || 0);
  const ca3 = Number(tr.children[4].querySelector('input').value || 0);
  const exam = Number(tr.children[5].querySelector('input').value || 0);
  if(ca1 > 10 || ca2 > 10 || ca3 > 10) { toast('CA max is 10', true); return; }
  if(exam > DB.settings.examMax) { toast('Exam max ' + DB.settings.examMax, true); return; }
  const total = ca1 + ca2 + ca3 + exam;
  const g = gradeFor(total);
  tr.querySelector('.totalCell').textContent = total;
  tr.querySelector('.gradeCell').textContent = g.grade;
}

function saveMyScoreSheet(cls, arm, subj) {
  const rows = document.querySelectorAll('#myScoreSheetPanel tbody tr[data-adm]');
  let saved = 0;
  rows.forEach(tr => {
    const adm = tr.dataset.adm;
    const ca1 = Number(tr.children[2].querySelector('input').value || 0);
    const ca2 = Number(tr.children[3].querySelector('input').value || 0);
    const ca3 = Number(tr.children[4].querySelector('input').value || 0);
    const exam = Number(tr.children[5].querySelector('input').value || 0);
    if(ca1 === 0 && ca2 === 0 && ca3 === 0 && exam === 0) return;
    const total = ca1 + ca2 + ca3 + exam;
    const g = gradeFor(total);
    const idx = DB.scores.findIndex(s => s.session === DB.settings.session && s.term === DB.settings.term && s.class === cls && s.arm === arm && s.subject === subj && s.admissionNo === adm);
    const rec = { session: DB.settings.session, term: DB.settings.term, class: cls, arm: arm, subject: subj, admissionNo: adm, ca1, ca2, ca3, exam, total, grade: g.grade, remark: g.remark };
    if(idx >= 0) DB.scores[idx] = rec;
    else DB.scores.push(rec);
    saved++;
  });
  audit('Saved ' + saved + ' scores');
  saveDB();
  toast(saved + ' scores saved.');
  loadMyScoreSheet();
}

function getJSONData() {
    // Return the current database as JSON
    const data = {
        students: DB.students,
        teachers: DB.teachers,
        classes: DB.classes,
        subjects: DB.subjects,
        scores: DB.scores,
        attendance: DB.attendance,

        staffMessages: DB.staffMessages,
        expenses: DB.expenses,
        scoreApprovals: DB.scoreApprovals,
        importHistory: DB.importHistory,
        auditLog: DB.auditLog
    };
    return JSON.stringify(data, null, 2);
}

function getJSONLink() {
    // Generate a download link for the JSON data
    const jsonData = getJSONData();
    const blob = new Blob([jsonData], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    
    // Create a temporary link and trigger download
    const a = document.createElement('a');
    a.href = url;
    a.download = `school_data_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    toast('JSON data downloaded successfully!');
    audit('Downloaded JSON data');
}

function importJSONData() {
    const fileInput = document.getElementById('jsonImportFile');
    if(!fileInput.files.length) { toast('Choose a JSON file.', true); return; }
    if(!confirm('Import JSON data? This will merge with existing data.')) return;
    
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const incoming = JSON.parse(e.target.result);
            let imported = 0;
            let sections = [];
            
            // Merge data safely with validation
            if(incoming.students && Array.isArray(incoming.students)) { 
                DB.students = incoming.students; 
                imported++; 
                sections.push('Students');
            }
            if(incoming.teachers && Array.isArray(incoming.teachers)) { 
                DB.teachers = incoming.teachers; 
                imported++; 
                sections.push('Teachers');
            }
            if(incoming.classes && Array.isArray(incoming.classes)) { 
                DB.classes = incoming.classes; 
                imported++; 
                sections.push('Classes');
            }
            if(incoming.subjects && Array.isArray(incoming.subjects)) { 
                DB.subjects = incoming.subjects; 
                imported++; 
                sections.push('Subjects');
            }
            if(incoming.scores && Array.isArray(incoming.scores)) { 
                DB.scores = incoming.scores; 
                imported++; 
                sections.push('Scores');
            }
            if(incoming.attendance && Array.isArray(incoming.attendance)) { 
                DB.attendance = incoming.attendance; 
                imported++; 
                sections.push('Attendance');
            }
            if(incoming.fees && Array.isArray(incoming.fees)) { 
                DB.fees = incoming.fees; 
                imported++; 
                sections.push('Fees');
            }
            if(incoming.settings && typeof incoming.settings === 'object') { 
                Object.assign(DB.settings, incoming.settings); 
                imported++; 
                sections.push('Settings');
            }
            if(incoming.users && Array.isArray(incoming.users)) { 
                DB.users = incoming.users; 
                imported++; 
                sections.push('Users');
            }
            if(incoming.announcements && Array.isArray(incoming.announcements)) { 
                DB.announcements = incoming.announcements; 
                imported++; 
                sections.push('Announcements');
            }
            if(incoming.timetables && typeof incoming.timetables === 'object') { 
                DB.timetables = incoming.timetables; 
                imported++; 
                sections.push('Timetables');
            }
            if(incoming.studentSubjects && typeof incoming.studentSubjects === 'object') { 
                DB.studentSubjects = incoming.studentSubjects; 
                imported++; 
                sections.push('Student Subjects');
            }
            if(incoming.resultPublishStatus && typeof incoming.resultPublishStatus === 'object') { 
                DB.resultPublishStatus = incoming.resultPublishStatus; 
                imported++; 
                sections.push('Publish Status');
            }
            if(incoming.teacherSalaries && Array.isArray(incoming.teacherSalaries)) { 
                DB.teacherSalaries = incoming.teacherSalaries; 
                imported++; 
                sections.push('Salaries');
            }
            if(incoming.staffMessages && Array.isArray(incoming.staffMessages)) { 
                DB.staffMessages = incoming.staffMessages; 
                imported++; 
                sections.push('Staff Messages');
            }
            if(incoming.expenses && Array.isArray(incoming.expenses)) { 
                DB.expenses = incoming.expenses; 
                imported++; 
                sections.push('Expenses');
            }
            
            audit('Imported JSON data - ' + imported + ' sections: ' + sections.join(', '));
            saveDB();
            toast('JSON imported successfully! ' + imported + ' sections updated.\n' + sections.join(', '));
            renderData();
        } catch(err) { 
            toast('Invalid JSON file: ' + err.message, true); 
        }
    };
    reader.readAsText(fileInput.files[0]);
}

function copyJSONToClipboard() {
    const jsonData = getJSONData();
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(jsonData).then(() => {

        }).catch(() => {
            // Fallback
            const textarea = document.createElement('textarea');

            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            toast('JSON copied!');
        });
    } else {
        const textarea = document.createElement('textarea');
        textarea.value = jsonData;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        toast('JSON copied!');
    }
    audit('Copied JSON to clipboard');
}

// Sync JSON from file - merges the uploaded JSON with current DB
function syncJSONFromFile(input) {
    if(!input.files || !input.files.length) { toast('Choose a JSON file.', true); return; }
    if(!confirm('Sync JSON? This will merge the file data with the current database.')) {
        input.value = '';
        return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const incoming = JSON.parse(e.target.result);
            let merged = 0;
            let sections = [];
            // Merge each section safely
            if(incoming.students && Array.isArray(incoming.students)) { 
                DB.students = incoming.students; 
                merged++; 
                sections.push('Students');
            }
            if(incoming.teachers && Array.isArray(incoming.teachers)) { 
                DB.teachers = incoming.teachers; 
                merged++; 
                sections.push('Teachers');
            }
            if(incoming.classes && Array.isArray(incoming.classes)) { 
                DB.classes = incoming.classes; 
                merged++; 
                sections.push('Classes');
            }
            if(incoming.subjects && Array.isArray(incoming.subjects)) { 
                DB.subjects = incoming.subjects; 
                merged++; 
                sections.push('Subjects');
            }
            if(incoming.scores && Array.isArray(incoming.scores)) { 
                DB.scores = incoming.scores; 
                merged++; 
                sections.push('Scores');
            }
            if(incoming.attendance && Array.isArray(incoming.attendance)) { 
                DB.attendance = incoming.attendance; 
                merged++; 
                sections.push('Attendance');
            }
            if(incoming.fees && Array.isArray(incoming.fees)) { 
                DB.fees = incoming.fees; 
                merged++; 
                sections.push('Fees');
            }
            if(incoming.settings && typeof incoming.settings === 'object') { 
                Object.assign(DB.settings, incoming.settings); 
                merged++; 
                sections.push('Settings');
            }
            if(incoming.users && Array.isArray(incoming.users)) { 
                DB.users = incoming.users; 
                merged++; 
                sections.push('Users');
            }
            if(incoming.announcements && Array.isArray(incoming.announcements)) { 
                DB.announcements = incoming.announcements; 
                merged++; 
                sections.push('Announcements');
            }
            if(incoming.timetables && typeof incoming.timetables === 'object') { 
                DB.timetables = incoming.timetables; 
                merged++; 
                sections.push('Timetables');
            }
            if(incoming.studentSubjects && typeof incoming.studentSubjects === 'object') { 
                DB.studentSubjects = incoming.studentSubjects; 
                merged++; 
                sections.push('Student Subjects');
            }
            if(incoming.resultPublishStatus && typeof incoming.resultPublishStatus === 'object') { 
                DB.resultPublishStatus = incoming.resultPublishStatus; 
                merged++; 
                sections.push('Publish Status');
            }
            if(incoming.teacherSalaries && Array.isArray(incoming.teacherSalaries)) { 
                DB.teacherSalaries = incoming.teacherSalaries; 
                merged++; 
                sections.push('Salaries');
            }
            if(incoming.staffMessages && Array.isArray(incoming.staffMessages)) { 
                DB.staffMessages = incoming.staffMessages; 
                merged++; 
                sections.push('Staff Messages');
            }
            if(incoming.expenses && Array.isArray(incoming.expenses)) { 
                DB.expenses = incoming.expenses; 
                merged++; 
                sections.push('Expenses');
            }
            // Save and notify
            audit('Synced JSON data - ' + merged + ' sections: ' + sections.join(', '));
            saveDB();
            toast('JSON sync successful! ' + merged + ' sections merged.\n' + sections.join(', '));
            renderData();
        } catch(err) {
            toast('Invalid JSON file: ' + err.message, true);
        }
        input.value = '';
    };
    reader.readAsText(input.files[0]);
}

// DATA MANAGEMENT FUNCTIONS
function exportBackup() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'school_mis_backup_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  audit('Exported backup');
  toast('Backup downloaded.');
}

function restoreBackup() {
  const fileInput = document.getElementById('restoreFile');
  if(!fileInput.files.length) { toast('Choose a backup file.', true); return; }
  if(!confirm('Replace current data with backup?')) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const incoming = JSON.parse(e.target.result);
      if(!incoming.settings || !incoming.students) { toast('Invalid backup.', true); return; }
      DB = incoming;
      mergeDefaults();
      if(!DB.users) DB.users = [{ username: 'admin', password: DB.settings.adminPasswordHash || 'DanGombe@2026', role: 'admin', fullName: 'Administrator', subjects: [], assignedClass: '', roles: ['admin'], isStudent: false }];
      if(!DB.scoreApprovals) DB.scoreApprovals = {};
      if(!DB.sessions || !DB.sessions.length) DB.sessions = ["2023/2024", "2024/2025", "2025/2026"];
      if(!DB.teacherSalaries) DB.teacherSalaries = [];
      if(!DB.staffMessages) DB.staffMessages = [];
      if(!DB.expenses) DB.expenses = [];
      if(!DB.timetables) DB.timetables = {};
      if(!DB.studentSubjects) DB.studentSubjects = {};
      if(!DB.resultPublishStatus) DB.resultPublishStatus = {};
      audit('Restored from backup');
      saveDB();
      toast('Restored.');
      go('dashboard');
    } catch(err) { toast('Invalid file.', true); }
  };
  reader.readAsText(fileInput.files[0]);
}

function clearAcademicData() {
  if(!confirm('Delete all scores and attendance?')) return;
  DB.scores = [];
  DB.attendance = [];
  DB.comments = {};
  DB.scoreApprovals = {};
  audit('Cleared academic data');
  saveDB();
  toast('Cleared.');
  renderData();
}

function fullReset() {
  if(prompt('Type RESET to confirm:') !== 'RESET') { toast('Cancelled.', true); return; }
  const pin = DB.settings.resetPin;
  const pwd = DB.settings.adminPasswordHash;
  DB = JSON.parse(JSON.stringify(DEFAULT_DATA));
  DB.settings.resetPin = pin;
  DB.settings.adminPasswordHash = pwd;
  DB.users = [{ username: 'admin', password: pwd || 'DanGombe@2026', role: 'admin', fullName: 'Administrator', subjects: [], assignedClass: '', roles: ['admin'], isStudent: false }];
  DB.sessions = ["2023/2024", "2024/2025", "2025/2026"];
  audit('Full reset');
  saveDB();
  go('dashboard');
  toast('Reset complete.');
}

  // Set default login type

  document.getElementById('loginUser').addEventListener('keypress', function(e) {
    if(e.key === 'Enter') document.getElementById('loginPass').focus();
  });
  document.getElementById('loginPass').addEventListener('keypress', function(e) {
    if(e.key === 'Enter') doLogin();
  });

  document.getElementById('loginUser').focus();

  // Update logo display on load
  updateLogoDisplay();

  // Tell the admin whether online mode is active.
  if (!online && !ONLINE_DB_ENABLED) {
    console.warn('School MIS is currently using local storage. Add Supabase credentials in the configuration section to enable online database.');
  }
})();
