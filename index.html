<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Management System</title>
<style>
  :root {
    --navy: #0b1f3a;
    --navy-2: #12294d;
    --navy-3: #1c3a68;
    --gold: #c9971f;
    --gold-light: #fdf1dc;
    --green: #2f7d5a;
    --green-light: #e2f3ea;
    --red: #b3382c;
    --red-light: #fbe6e3;
    --bg: #f0f2f6;
    --panel: #ffffff;
    --border: #dfe4ea;
    --text: #1c2733;
    --muted: #5b6b7c;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --radius: 12px;
    --transition: all 0.3s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ===== LOGIN PAGE ===== */
  #loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--navy) 0%, #0a1530 100%);
    padding: 20px;
  }
  #loginPage .login-container {
    display: flex;
    max-width: 1000px;
    width: 100%;
    background: var(--panel);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4);
  }
  #loginPage .login-brand {
    flex: 1;
    background: linear-gradient(135deg, var(--navy), var(--navy-3));
    padding: 50px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    min-width: 280px;
  }
  #loginPage .login-brand .logo-placeholder {
    width: 80px;
    height: 80px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin-bottom: 16px;
    border: 2px solid rgba(255,255,255,0.2);
  }
  #loginPage .login-brand #loginLogo img {
    height: 80px;
    margin-bottom: 16px;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 8px;
  }
  #loginPage .login-brand h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  #loginPage .login-brand .sub {
    font-size: 13px;
    opacity: 0.8;
    font-weight: 300;
  }
  #loginPage .login-brand .motto {
    font-size: 14px;
    font-style: italic;
    opacity: 0.7;
    margin-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.15);
    padding-top: 14px;
    width: 100%;
  }
  #loginPage .login-form {
    flex: 1.2;
    padding: 50px 40px;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  #loginPage .login-form .login-type-selector {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  #loginPage .login-form .login-type-selector button {
    flex: 1;
    padding: 10px;
    border: 2px solid var(--border);
    border-radius: 8px;
    background: #fafbfc;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: var(--transition);
    color: var(--muted);
  }
  #loginPage .login-form .login-type-selector button.active {
    border-color: var(--gold);
    background: var(--gold-light);
    color: var(--navy);
  }
  #loginPage .login-form .login-type-selector button:hover {
    border-color: var(--gold);
  }
  #loginPage .login-form .login-type-label {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
    padding: 8px;
    background: #f8fafc;
    border-radius: 6px;
  }
  #loginPage .login-form h2 {
    font-size: 24px;
    color: var(--navy);
    margin-bottom: 4px;
  }
  #loginPage .login-form .sub-text {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
  }
  #loginPage .login-form .form-group {
    margin-bottom: 18px;
  }
  #loginPage .login-form label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 5px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  #loginPage .login-form input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    transition: var(--transition);
    background: #fafbfc;
  }
  #loginPage .login-form input:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,151,31,0.15);
    background: #fff;
  }
  #loginPage .login-form .login-btn {
    width: 100%;
    padding: 13px;
    background: var(--gold);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 6px;
  }
  #loginPage .login-form .login-btn:hover {
    background: #b8860b;
    transform: translateY(-1px);
    box-shadow: 0 4px 15px rgba(201,151,31,0.3);
  }
  #loginPage .login-form .login-err {
    color: var(--red);
    font-size: 13px;
    margin-top: 10px;
    min-height: 20px;
    text-align: center;
  }
  #loginPage .login-form .login-footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  #loginPage .login-form .login-footer strong {
    color: var(--navy);
  }

  /* ===== MAIN APP ===== */
  #app {
    display: none;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== SHELL LAYOUT ===== */
  .shell {
    display: flex;
    height: 100vh;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: 260px;
    background: var(--navy);
    color: #dfe8f5;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    z-index: 100;
    transition: var(--transition);
  }
  .sidebar .brand {
    padding: 22px 18px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    text-align: center;
  }
  .sidebar .brand #sidebarLogo img {
    height: 44px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 4px;
  }
  .sidebar .brand .name {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
    color: #fff;
    line-height: 1.3;
  }
  .sidebar .brand .tag {
    font-size: 10px;
    color: #9fb3cc;
    margin-top: 3px;
  }
  .sidebar .nav {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
  }
  .sidebar .nav .nav-group {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #6a8aaa;
    padding: 14px 20px 6px;
    font-weight: 600;
  }
  .sidebar .nav button {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: #c6d4e6;
    padding: 10px 20px;
    font-size: 13px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: var(--transition);
  }
  .sidebar .nav button:hover {
    background: rgba(255,255,255,0.06);
    color: #fff;
  }
  .sidebar .nav button.active {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-left-color: var(--gold);
    font-weight: 600;
  }
  .sidebar .nav button .icon {
    font-size: 16px;
    width: 24px;
    text-align: center;
  }
  .sidebar .sidebar-foot {
    padding: 12px 18px;
    border-top: 1px solid rgba(255,255,255,0.06);
    font-size: 10px;
    color: #6a8aaa;
    text-align: center;
  }

  /* ===== MAIN CONTENT ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  /* ===== TOPBAR ===== */
  .topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar #topbarLogo img {
    height: 32px;
  }
  .topbar h2 {
    margin: 0;
    font-size: 18px;
    color: var(--navy);
    font-weight: 600;
  }
  .topbar .user-info {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
    color: var(--muted);
    flex-wrap: wrap;
  }
  .topbar .user-info .role-badge {
    background: var(--gold-light);
    color: var(--gold);
    padding: 3px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .topbar .user-info .role-badge.student {
    background: #f3e8ff;
    color: #6d28d9;
  }
  .topbar .user-info .role-badge.admin {
    background: #dbeafe;
    color: #1e40af;
  }
  .topbar .user-info button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
    color: var(--navy);
    transition: var(--transition);
  }
  .topbar .user-info button:hover {
    background: #f0f2f5;
  }
  .topbar .user-info .logout-btn {
    color: var(--red);
    border-color: var(--red);
  }
  .topbar .user-info .logout-btn:hover {
    background: var(--red-light);
  }

  /* ===== CONTENT ===== */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
  }

  /* ===== CARDS ===== */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    border-top: 3px solid var(--navy-3);
    box-shadow: var(--shadow);
    transition: var(--transition);
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.1);
  }
  .card .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    font-weight: 600;
  }
  .card .val {
    font-size: 26px;
    font-weight: 700;
    color: var(--navy);
    margin-top: 4px;
  }
  .card .val .sub-val {
    font-size: 14px;
    font-weight: 400;
    color: var(--muted);
  }
  .card.gold { border-top-color: var(--gold); }
  .card.green { border-top-color: var(--green); }
  .card.red { border-top-color: var(--red); }
  .card.purple { border-top-color: #6c5b7b; }

  /* ===== PANELS ===== */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .panel h3 {
    margin: 0 0 14px;
    font-size: 15px;
    color: var(--navy);
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* ===== ROWS & FIELDS ===== */
  .row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: end;
    margin-bottom: 14px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 140px;
  }
  .field label {
    font-size: 11px;
    font-weight: 600;
    color: var(--navy);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .field input,
  .field select,
  .field textarea {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    transition: var(--transition);
    background: #fafbfc;
    font-family: inherit;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(201,151,31,0.12);
    background: #fff;
  }
  .field input[type="file"] {
    padding: 6px;
    background: #fff;
  }
  .field .preview-image {
    max-width: 100px;
    max-height: 100px;
    border-radius: 8px;
    border: 1px solid var(--border);
    object-fit: cover;
    margin-top: 4px;
  }

  /* ===== BUTTONS ===== */
  .btn {
    background: var(--navy);
    color: #fff;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .btn:hover {
    background: var(--navy-3);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(11,31,58,0.2);
  }
  .btn.gold { background: var(--gold); }
  .btn.gold:hover { background: #b8860b; }
  .btn.green { background: var(--green); }
  .btn.green:hover { background: #1e5a3f; }
  .btn.red { background: var(--red); }
  .btn.red:hover { background: #8f2c22; }
  .btn.ghost {
    background: #fff;
    color: var(--navy);
    border: 1px solid var(--border);
  }
  .btn.ghost:hover {
    background: #f0f2f5;
    box-shadow: none;
    transform: none;
  }
  .btn.sm { padding: 4px 12px; font-size: 11px; }
  .btn.xs { padding: 2px 8px; font-size: 10px; }

  /* ===== TABLES ===== */
  .table-wrap {
    overflow-x: auto;
    max-height: 450px;
    overflow-y: auto;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  th, td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  th {
    background: var(--navy);
    color: #fff;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  tr:nth-child(even) td { background: #f8fafc; }
  tr:hover td { background: #f0f4fa; }
  td .student-thumb {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--border);
  }

  /* ===== PILLS & BADGES ===== */
  .pill {
    display: inline-block;
    padding: 2px 12px;
    border-radius: 20px;
    font-size: 10.5px;
    font-weight: 700;
  }
  .pill.ok { background: var(--green-light); color: var(--green); }
  .pill.bad { background: var(--red-light); color: var(--red); }
  .pill.mid { background: var(--gold-light); color: var(--gold); }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge.published { background: var(--green-light); color: var(--green); }
  .badge.pending { background: var(--gold-light); color: var(--gold); }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy);
    color: #fff;
    padding: 14px 24px;
    border-radius: 8px;
    font-size: 13px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    z-index: 999;
    display: none;
    max-width: 420px;
    animation: slideUp 0.3s ease;
  }
  .toast.err { background: var(--red); }
  .toast.success { background: var(--green); }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== MODAL ===== */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(11,31,58,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 500;
    backdrop-filter: blur(4px);
  }
  .modal {
    background: #fff;
    border-radius: var(--radius);
    padding: 28px 32px;
    max-width: 720px;
    width: 94vw;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    animation: modalIn 0.3s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal h3 {
    margin-top: 0;
    color: var(--navy);
    font-size: 18px;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  /* ===== QUICK ACTIONS ===== */
  .quick {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
  }
  .quick button {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 12px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--navy);
    cursor: pointer;
    transition: var(--transition);
    text-align: center;
  }
  .quick button:hover {
    border-color: var(--gold);
    background: var(--gold-light);
    transform: translateY(-2px);
  }

  /* ===== STUDENT PROFILE ===== */
  .student-profile-header {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 24px;
    align-items: start;
  }
  .student-profile-header .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid var(--gold);
    background: #f0f2f5;
  }
  .student-profile-header .info h2 {
    margin: 0 0 4px;
    color: var(--navy);
  }
  .student-profile-header .info .sub {
    color: var(--muted);
    font-size: 14px;
  }
  .student-profile-header .info .details {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 8px;
    font-size: 13px;
  }
  .student-profile-header .info .details span {
    background: #f8fafc;
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* ===== REGISTRATION SLIP ===== */
  .registration-slip {
    max-width: 800px;
    margin: 0 auto;
    padding: 30px;
    background: #fff;
    border: 2px solid var(--navy);
    border-radius: var(--radius);
  }
  .registration-slip .header {
    text-align: center;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .registration-slip .header h1 {
    font-size: 20px;
    color: var(--navy);
    margin: 0;
  }
  .registration-slip .student-info {
    display: grid;
    grid-template-columns: 100px 1fr;
    gap: 12px;
    align-items: start;
    margin-bottom: 16px;
    padding: 12px;
    background: #f8fafc;
    border-radius: 8px;
  }
  .registration-slip .student-info .thumb {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--gold);
  }
  .registration-slip .signature-section {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .registration-slip .signature-section .sig {
    text-align: center;
  }
  .registration-slip .signature-section .sig .line {
    width: 180px;
    border-top: 1px solid #333;
    margin-top: 30px;
    padding-top: 4px;
  }
  .registration-slip .signature-section .sig img {
    height: 50px;
    display: block;
    margin: 0 auto;
  }

  /* ===== ADMISSION LETTER ===== */
  .admission-letter {
    max-width: 800px;
    margin: 0 auto;
    padding: 30px;
    background: #fff;
    border: 2px solid var(--navy);
    border-radius: var(--radius);
  }
  .admission-letter .letter-header {
    text-align: center;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  .admission-letter .letter-header h1 {
    font-size: 20px;
    color: var(--navy);
    margin: 0;
  }

  /* ===== RECEIPT ===== */
  .receipt-print {
    max-width: 500px;
    margin: 0 auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
  }
  .receipt-print .header {
    text-align: center;
    border-bottom: 2px solid var(--navy);
    padding-bottom: 10px;
    margin-bottom: 16px;
  }

function resizeImage(file, maxDim, callback) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > maxDim || h > maxDim) {
        if(w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; } 
        else { w = Math.round(w * (maxDim / h)); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.onerror = () => callback(null);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function setLoginType(type) {
  LOGIN_TYPE = type;

  document.getElementById('loginTypeStaff').className = type === 'staff' ? 'active' : '';
  
  const label = document.getElementById('loginTypeLabel');
  const inputLabel = document.getElementById('loginLabel');

  if(type === 'student') {
    label.innerHTML = '🔑 Student Login - Use your Admission Number';
    inputLabel.textContent = 'Admission Number';
    userInput.placeholder = 'Enter your Admission Number';

// ===== LOGIN =====
function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  
  if(!u || !p) {
    document.getElementById('loginErr').textContent = 'Please enter username and password.';
    return;
  }
  
  let user = DB.users.find(x => x.username === u && x.password === p);
  
  if(LOGIN_TYPE === 'student') {
    if(user && !user.isStudent) {
      document.getElementById('loginErr').textContent = 'This account is not a student account. Please use Staff login.';
      return;
    }
    if(!user) {
      document.getElementById('loginErr').textContent = 'Invalid Admission Number or Password.';
      return;
    }
  } else {
    if(user && user.isStudent) {
      document.getElementById('loginErr').textContent = 'This is a student account. Please use Student login.';
      return;
    }
    if(!user) {
      document.getElementById('loginErr').textContent = 'Invalid Username or Password.';
      return;
    }
  }
  
  if(user) {
    CURRENT_USER = u;
    CURRENT_USER_ROLE = user.role;
    CURRENT_USER_DATA = user;
    
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('footYear').textContent = new Date().getFullYear();
    
    updateLogoDisplay();
    audit('User logged in: ' + u);
    buildNav();
    updateTopBar();
    go('dashboard');
  }
}

function logout() {
  CURRENT_USER = null;
  CURRENT_USER_ROLE = null;
  CURRENT_USER_DATA = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginErr').textContent = '';
  updateLogoDisplay();
}

function updateTopBar() {
  const user = DB.users.find(u => u.username === CURRENT_USER);
  document.getElementById('sessionLabel').textContent = DB.settings.session + ' • ' + DB.settings.term;
  document.getElementById('userNameLabel').textContent = user ? user.fullName : CURRENT_USER;
  const badge = document.getElementById('roleBadge');
  const roleDisplay = user ? (user.isStudent ? 'Student' : user.role.toUpperCase()) : '';
  badge.textContent = roleDisplay;
  badge.className = 'role-badge ' + getRoleBadgeClass(user ? user.role : '');
}

// ===== CHANGE PASSWORD =====
function changeOwnPassword() {
  const user = DB.users.find(u => u.username === CURRENT_USER);
  const isStudent = user?.isStudent || false;
  const canChange = !isStudent || DB.settings.studentCanEditProfile;
  
  if(isStudent && !canChange) {
    toast('Student password changes are disabled by admin.', true);
    return;
  }
  
  showModal(`
    <h3>Change Your Password</h3>
    <div class="field"><label>Current Password</label><input id="oldPass" type="password"></div>
    <div class="field"><label>New Password</label><input id="newPass1" type="password"></div>
    <div class="field"><label>Confirm New Password</label><input id="newPass2" type="password"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveOwnPassword()">Update</button>
    </div>
  `);
}

function saveOwnPassword() {
  const old = document.getElementById('oldPass').value;
  const np1 = document.getElementById('newPass1').value;
  const np2 = document.getElementById('newPass2').value;
  
  if(!old || !np1 || !np2) { toast('All fields required.', true); return; }
  if(np1 !== np2) { toast('Passwords do not match.', true); return; }
  
  const user = DB.users.find(u => u.username === CURRENT_USER);
  if(!user || user.password !== old) { toast('Current password incorrect.', true); return; }
  
  user.password = np1;
  if(CURRENT_USER === 'admin') DB.settings.adminPasswordHash = np1;
  saveDB();
  closeModal();
  toast('Password updated.');
}

function previewEditProfilePicture(input) {
  const preview = document.getElementById('ep_picture_preview');
  if(input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      preview.innerHTML = `<img src="${e.target.result}" class="preview-image">`;
    };
    reader.readAsDataURL(input.files[0]);
  }
}

function saveEditProfile() {
  const user = CURRENT_USER_DATA;
  if(!user || !user.isStudent) { toast('Access denied.', true); return; }
  
  const student = DB.students.find(s => s.admissionNo === user.username);
  if(!student) { toast('Student not found.', true); return; }
  
  const fileInput = document.getElementById('ep_picture');
  const saveStudent = (picture) => {
    student.firstName = document.getElementById('ep_fn').value.trim() || student.firstName;
    student.middleName = document.getElementById('ep_mn').value.trim();
    student.surname = document.getElementById('ep_sn').value.trim() || student.surname;
    student.gender = document.getElementById('ep_gender').value;
    student.dob = document.getElementById('ep_dob').value;
    student.phone = document.getElementById('ep_phone').value.trim();
    student.parentName = document.getElementById('ep_pname').value.trim();
    student.parentPhone = document.getElementById('ep_pphone').value.trim();
    student.parentEmail = document.getElementById('ep_pemail').value.trim();
    student.address = document.getElementById('ep_address').value.trim();
    student.emergencyContact = document.getElementById('ep_emergency').value.trim();
    if(picture) student.picture = picture;
    student.profileUpdated = true;
    
    // Update user full name
    const userRecord = DB.users.find(u => u.username === user.username);
    if(userRecord) {
      userRecord.fullName = student.firstName + ' ' + (student.surname || '');
    }
    
    audit('Student ' + student.admissionNo + ' updated their profile');
    saveDB();
    toast('Profile updated successfully!');
    go('my_profile');
  };
  
  if(fileInput.files && fileInput.files[0]) {
    resizeImage(fileInput.files[0], 300, (dataUrl) => {
      saveStudent(dataUrl);
    });
  } else {
    saveStudent(null);
  }
}

        ${registeredSubjects.map((code, i) => {
          const sub = DB.subjects.find(s => s.code === code);
          return `<tr><td>${i+1}</td><td>${esc(code)}</td><td>${esc(sub?.name || code)}</td></tr>`;
        }).join('')}
        </tbody></table></div>
      ` : '<div class="empty">No subjects registered yet.</div>'}
    </div>
  `;
  
  c.innerHTML = html;
}

function updateSubjectRegistration(admissionNo, checkbox) {
  if(!window._tempSubjectReg) window._tempSubjectReg = {};
  if(!window._tempSubjectReg[admissionNo]) {
    window._tempSubjectReg[admissionNo] = [...(DB.studentSubjects[admissionNo] || [])];
  }
  
  const code = checkbox.value;
  const idx = window._tempSubjectReg[admissionNo].indexOf(code);
  if(checkbox.checked && idx === -1) {
    window._tempSubjectReg[admissionNo].push(code);
  } else if(!checkbox.checked && idx > -1) {
    window._tempSubjectReg[admissionNo].splice(idx, 1);
  }
}

function saveSubjectRegistration(admissionNo) {
  const subjects = window._tempSubjectReg?.[admissionNo] || [];
  if(subjects.length === 0) {
    toast('Please select at least one subject.', true);
    return;
  }
  
  DB.studentSubjects[admissionNo] = subjects;
  audit('Student ' + admissionNo + ' registered ' + subjects.length + ' subjects');
  saveDB();
  toast('Subjects registered successfully!');
  renderMySubjects();
}

function renderPaymentReceipt() {
  const c = document.getElementById('content');

    c.innerHTML = '<div class="panel"><div class="empty">Access restricted to students only.</div></div>';

  const student = DB.students.find(s => s.admissionNo === user.username);

  }
  
  const fees = DB.fees.filter(f => f.admissionNo === student.admissionNo);

function renderDashboard() {
  const c = document.getElementById('content');
  const user = CURRENT_USER_DATA;
  
  if(user && user.isStudent) {
    const student = DB.students.find(s => s.admissionNo === user.username);
    if(student) {
      const pictureHtml = student.picture ? 
        `<img src="${student.picture}" class="avatar" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);">` :
        `<div style="width:80px;height:80px;border-radius:50%;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:36px;border:3px solid var(--border);">👤</div>`;
      
      const fees = DB.fees.filter(f => f.admissionNo === student.admissionNo);
      const totalPaid = fees.reduce((n, f) => n + f.paid, 0);
      const totalExpected = fees.reduce((n, f) => n + f.expected, 0);
      const att = DB.attendance.filter(a => a.admissionNo === student.admissionNo && a.session === DB.settings.session);
      const totalPresent = att.reduce((n, a) => n + a.present, 0);
      const totalAbsent = att.reduce((n, a) => n + a.absent, 0);
      
      const registeredSubjects = DB.studentSubjects[student.admissionNo] || [];
      const isPublished = DB.resultPublishStatus[DB.settings.session]?.[DB.settings.term] || false;
      
      const currentScores = DB.scores.filter(s => 
        s.session === DB.settings.session && 
        s.term === DB.settings.term && 
        s.admissionNo === student.admissionNo
      );
      const totalScore = currentScores.reduce((n, r) => n + r.total, 0);
      const avgScore = currentScores.length ? (totalScore / currentScores.length) : 0;
      
      c.innerHTML = `
        <div class="panel">
          <h3>👋 Welcome, ${esc(student.firstName)}!</h3>
          <div class="student-profile-header">
            <div>${pictureHtml}</div>
            <div class="info">
              <h2>${esc(student.firstName)} ${esc(student.surname)}</h2>
              <div class="sub">${esc(student.class)} ${student.arm ? 'Arm ' + esc(student.arm) : ''} • ${esc(student.admissionNo)}</div>
              <div class="details">
                <span>📚 ${registeredSubjects.length} Subjects</span>
                <span>💰 ₦${totalPaid.toLocaleString()} paid</span>
                <span>📋 ${totalPresent} P / ${totalAbsent} A</span>
                ${isPublished ? '<span class="pill ok">✅ Results Published</span>' : '<span class="pill mid">⏳ Results Pending</span>'}
              </div>
            </div>
          </div>
        </div>
        <div class="cards">
          <div class="card gold"><div class="lbl">Fees Paid</div><div class="val">₦${totalPaid.toLocaleString()}</div></div>
          <div class="card red"><div class="lbl">Balance</div><div class="val">₦${(totalExpected - totalPaid).toLocaleString()}</div></div>
          <div class="card green"><div class="lbl">Attendance</div><div class="val">${totalPresent} <span class="sub-val">/ ${totalPresent + totalAbsent}</span></div></div>
          <div class="card purple"><div class="lbl">Current Avg</div><div class="val">${avgScore.toFixed(1)}</div></div>
        </div>
        <div class="panel">
          <h3>⚡ Quick Actions</h3>
          <div class="quick">
            <button onclick="go('my_subjects')">📚 Register Subjects</button>
            <button onclick="go('registration_slip')">📋 Registration Slip</button>
            <button onclick="go('my_results')">📄 View Results</button>
            <button onclick="go('admission_letter')">📜 Admission Letter</button>
            <button onclick="go('payment_receipt')">🧾 Payment Receipt</button>
            <button onclick="go('my_profile')">👤 My Profile</button>
          </div>
        </div>
        <div class="panel">
          <h3>📢 Announcements</h3>
          ${DB.announcements && DB.announcements.length ? 
            DB.announcements.slice(0, 5).map(a => `<div style="border-bottom:1px solid var(--border);padding:6px 0;"><strong>${a.date}</strong> - ${esc(a.message)}</div>`).join('') :
            '<div class="muted">No announcements.</div>'
          }
        </div>
      `;
      return;
    }
  }
  
  // Admin/Staff dashboard
  const role = CURRENT_USER_ROLE;
  let html = '';
  
  const totalStudents = DB.students.filter(s => s.status === 'Active').length;
  const male = DB.students.filter(s => s.status === 'Active' && s.gender === 'Male').length;
  const female = DB.students.filter(s => s.status === 'Active' && s.gender === 'Female').length;
  const totalTeachers = DB.teachers.length;
  const totalClasses = classArmList().length;
  const totalSubjects = DB.subjects.length;
  const feesPaid = DB.fees.reduce((n, f) => n + Number(f.paid || 0), 0);
  const feesExpected = DB.fees.reduce((n, f) => n + Number(f.expected || 0), 0);
  const unreadMsgs = DB.staffMessages.filter(m => m.recipient === CURRENT_USER && !m.read).length;
  
  html += `
    <div class="cards">
      <div class="card"><div class="lbl">Total Students</div><div class="val">${totalStudents}</div></div>
      <div class="card gold"><div class="lbl">Male / Female</div><div class="val">${male} / ${female}</div></div>
      <div class="card green"><div class="lbl">Teachers</div><div class="val">${totalTeachers}</div></div>
      <div class="card purple"><div class="lbl">Classes</div><div class="val">${totalClasses}</div></div>
      <div class="card"><div class="lbl">Subjects</div><div class="val">${totalSubjects}</div></div>
      <div class="card green"><div class="lbl">Fees Collected</div><div class="val">₦${feesPaid.toLocaleString()}</div></div>
      <div class="card red"><div class="lbl">Fees Outstanding</div><div class="val">₦${(feesExpected - feesPaid).toLocaleString()}</div></div>
      ${unreadMsgs > 0 ? `<div class="card red"><div class="lbl">📩 Unread Messages</div><div class="val">${unreadMsgs}</div></div>` : ''}
      <div class="card"><div class="lbl">Session</div><div class="val" style="font-size:16px">${DB.settings.session}<br><span class="sub-val">${DB.settings.term}</span></div></div>
    </div>
  `;
  
  let actions = [];
  if(role === 'admin') {
    actions = ['Students', 'Teachers', 'Scores', 'Publish Results', 'Result Sheet', 'Timetable', 'Fees', 'Attendance', 'Session Rollover'];
  } else if(role === 'exams') {
    actions = ['Scores', 'Bulk Upload', 'Approve Scores', 'Publish Results', 'Result Sheet', 'Session Rollover'];
  } else if(role === 'bursary') {
    actions = ['Fees', 'Receipts', 'Fee Analysis', 'Teacher Salaries', 'Expenses'];
  } else if(role === 'formmaster') {
    actions = ['My Class Students', 'Attendance'];
    if(CURRENT_USER_DATA?.subjects?.length) actions.push('My Subjects');
  } else if(role === 'registration') {
    actions = ['Students', 'Bulk Upload'];
  } else if(role === 'staff') {
    if(CURRENT_USER_DATA?.subjects?.length) actions.push('My Subjects');
    if(CURRENT_USER_DATA?.assignedClass) actions.push('My Class Students');
  }
  
  if(actions.length) {
    html += `<div class="panel"><h3>⚡ Quick Actions</h3><div class="quick">`;
    actions.forEach(a => {
      const id = a.toLowerCase().replace(/ /g, '_');
      html += `<button onclick="go('${id}')">${a}</button>`;
    });
    html += `</div></div>`;
  }
  
  html += `<div class="panel"><h3>📢 Announcements</h3>`;
  if(DB.announcements && DB.announcements.length) {
    DB.announcements.slice(0, 5).forEach((a, i) => {
      html += `<div style="border-bottom:1px solid var(--border);padding:6px 0">
        <strong>${a.date}</strong> - ${esc(a.message)}
        ${role === 'admin' ? `<button class="btn sm ghost" onclick="editAnnouncement(${i})">Edit</button>
        <button class="btn sm red" onclick="deleteAnnouncement(${i})">Delete</button>` : ''}
      </div>`;
    });
  } else {
    html += `<div class="muted">No announcements yet.</div>`;
  }
  if(role === 'admin') {
    html += `<button class="btn sm ghost" style="margin-top:10px" onclick="postAnnouncement()">+ Post Announcement</button>`;
  }
  html += `</div>`;
  
  c.innerHTML = html;
}

// ===== ANNOUNCEMENTS =====
function postAnnouncement() {
  showModal(`
    <h3>Post Announcement</h3>
    <div class="field"><textarea id="announceText" rows="3" style="width:100%" placeholder="Type announcement..."></textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveAnnouncement()">Post</button>
    </div>
  `);
}

function saveAnnouncement() {
  const msg = document.getElementById('announceText').value.trim();
  if(!msg) { toast('Enter a message.', true); return; }
  DB.announcements.unshift({ date: new Date().toLocaleString(), message: msg });
  audit('Posted announcement');
  saveDB();
  closeModal();
  toast('Posted.');
  go('dashboard');
}

function editAnnouncement(index) {
  const a = DB.announcements[index];
  if(!a) return;
  showModal(`
    <h3>Edit Announcement</h3>
    <div class="field"><textarea id="editAnnounceText" rows="3" style="width:100%">${esc(a.message)}</textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveEditedAnnouncement(${index})">Update</button>
    </div>
  `);
}

function saveEditedAnnouncement(index) {
  const msg = document.getElementById('editAnnounceText').value.trim();
  if(!msg) { toast('Enter a message.', true); return; }
  DB.announcements[index].message = msg;
  DB.announcements[index].date = new Date().toLocaleString() + ' (edited)';
  audit('Edited announcement');
  saveDB();
  closeModal();
  toast('Updated.');
  go('dashboard');
}

function deleteAnnouncement(index) {
  if(!confirm('Delete this announcement?')) return;
  DB.announcements.splice(index, 1);
  audit('Deleted announcement');
  saveDB();
  toast('Deleted.');
  go('dashboard');
}

function renderMessages() {
  const c = document.getElementById('content');
  const isAdmin = CURRENT_USER_ROLE === 'admin';
  
  let html = `<div class="panel"><h3>📩 Staff Messages</h3>`;
  
  if(isAdmin) {
    html += `
      <div class="row">
        <div class="field"><label>Recipient</label>
          <select id="msgRecipient">
            <option value="">All Staff</option>
            ${DB.users.filter(u => u.username !== 'admin' && !u.isStudent).map(u => 
              `<option value="${u.username}">${u.fullName} (${u.role})</option>`
            ).join('')}
          </select>
        </div>
        <div class="field"><label>Subject</label><input id="msgSubject" placeholder="Subject"></div>
        <div class="field"><label>Message</label><textarea id="msgBody" rows="2" style="width:250px"></textarea></div>
        <button class="btn" onclick="sendStaffMessage()">Send</button>
      </div>
    `;
  }
  
  const myMsgs = DB.staffMessages.filter(m => m.recipient === CURRENT_USER || (m.recipient === '' && m.sender !== CURRENT_USER));
  if(myMsgs.length) {
    html += `<div style="margin-top:14px"><h4>Your Messages</h4>`;
    myMsgs.forEach((m, i) => {
      const isUnread = !m.read && m.recipient === CURRENT_USER;
      html += `<div class="msg-item ${isUnread ? 'msg-unread' : ''}">
        <div><strong>From:</strong> ${esc(m.senderName || m.sender)} <span class="msg-date">${m.date}</span></div>
        <div><strong>Subject:</strong> ${esc(m.subject || 'No subject')}</div>
        <div class="msg-body">${esc(m.body)}</div>
        ${m.recipient === CURRENT_USER && !m.read ? `<button class="btn sm ghost" onclick="markMsgRead(${i})">Mark Read</button>` : ''}
        ${m.recipient === CURRENT_USER ? `<button class="btn sm red" onclick="deleteMsg(${i})">Delete</button>` : ''}
      </div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="empty">No messages for you.</div>`;
  }
  html += `</div>`;
  c.innerHTML = html;
}

function sendStaffMessage() {
  const recipient = document.getElementById('msgRecipient').value;
  const subject = document.getElementById('msgSubject').value.trim();
  const body = document.getElementById('msgBody').value.trim();
  if(!body) { toast('Message body required.', true); return; }
  
  const user = DB.users.find(u => u.username === CURRENT_USER);
  DB.staffMessages.push({
    sender: CURRENT_USER,
    senderName: user ? user.fullName : CURRENT_USER,
    recipient: recipient || '',
    subject: subject || 'No subject',
    body: body,
    date: new Date().toLocaleString(),
    read: false
  });
  audit('Sent staff message');
  saveDB();
  toast('Message sent.');
  renderMessages();
}

function markMsgRead(index) {
  const msgs = DB.staffMessages.filter(m => m.recipient === CURRENT_USER);
  const msg = msgs[index];
  const idx = DB.staffMessages.indexOf(msg);
  if(idx > -1) { DB.staffMessages[idx].read = true; saveDB(); renderMessages(); }
}

function deleteMsg(index) {
  if(!confirm('Delete this message?')) return;
  const msgs = DB.staffMessages.filter(m => m.recipient === CURRENT_USER);
  const msg = msgs[index];
  const idx = DB.staffMessages.indexOf(msg);
  if(idx > -1) { DB.staffMessages.splice(idx, 1); saveDB(); renderMessages(); }
}

function renderPublishResults() {
  const c = document.getElementById('content');
  if(CURRENT_USER_ROLE !== 'admin' && CURRENT_USER_ROLE !== 'exams') {
    c.innerHTML = '<div class="panel"><div class="empty">Access restricted. Only Admin and Exams Officer can publish results.</div></div>';
    return;
  }
  
  const session = DB.settings.session;
  const terms = ['First Term', 'Second Term', 'Third Term'];
  
  if(!DB.resultPublishStatus[session]) {
    DB.resultPublishStatus[session] = { 'First Term': false, 'Second Term': false, 'Third Term': false };
  }
  
  let html = `
    <div class="panel">
      <h3>📢 Publish Results - ${esc(session)}</h3>
      <p class="muted">Publish results for each term. Students can view and print results after publishing.</p>
      <div class="table-wrap"><table><thead><tr><th>Term</th><th>Status</th><th>Action</th></tr></thead><tbody>
  `;
  
  terms.forEach(term => {
    const isPublished = DB.resultPublishStatus[session]?.[term] || false;
    const hasScores = DB.scores.some(s => s.session === session && s.term === term);
    
    html += `
      <tr>
        <td><strong>${term}</strong></td>
        <td>
          ${isPublished ? 
            `<span class="badge published">✅ Published</span>` : 
            `<span class="badge pending">⏳ Pending</span>`
          }
          ${hasScores ? `<span style="font-size:11px;color:var(--muted);margin-left:8px;">(${DB.scores.filter(s => s.session === session && s.term === term).length} scores)</span>` : 
            `<span style="font-size:11px;color:var(--muted);margin-left:8px;">No scores</span>`}
        </td>
        <td>
          ${isPublished ? 
            `<button class="btn sm red" onclick="toggleResultPublish('${session}','${term}')">Unpublish</button>` :
            `<button class="btn sm green" onclick="toggleResultPublish('${session}','${term}')" ${hasScores ? '' : 'disabled'}>Publish</button>`
          }
        </td>
      </tr>
    `;
  });
  
  html += `</tbody></table></div></div>`;
  
  c.innerHTML = html;
}

function toggleResultPublish(session, term) {
  if(!DB.resultPublishStatus[session]) {
    DB.resultPublishStatus[session] = { 'First Term': false, 'Second Term': false, 'Third Term': false };
  }
  
  const current = DB.resultPublishStatus[session][term];
  const action = current ? 'Unpublish' : 'Publish';
  
  if(!confirm(`${action} results for ${term} ${session}?`)) return;
  
  DB.resultPublishStatus[session][term] = !current;
  audit(`${action}ed results for ${term} ${session}`);
  saveDB();
  toast(`Results ${action}ed for ${term}.`);
  renderPublishResults();
}

  } else {

  loadStudentForEdit();
}

function addStudent() {
  const adm = document.getElementById('s_adm').value.trim();
  if(!adm) { toast('Admission number required.', true); return; }
  const existing = DB.students.find(s => s.admissionNo === adm);
  const fn = document.getElementById('s_fn').value.trim();
  if(!fn) { toast('First name required.', true); return; }
  
  const fileInput = document.getElementById('s_picture');
  let pictureData = existing ? existing.picture : null;
  
  const saveStudent = (picture) => {
    const obj = {
      admissionNo: adm,
      firstName: fn,
      middleName: document.getElementById('s_mn').value.trim(),
      surname: document.getElementById('s_sn').value.trim(),
      gender: document.getElementById('s_gender').value,
      dob: document.getElementById('s_dob').value,
      class: document.getElementById('s_class').value,
      arm: document.getElementById('s_arm').value || '',
      parentName: document.getElementById('s_pname').value.trim(),
      parentPhone: document.getElementById('s_pphone').value.trim(),
      parentEmail: document.getElementById('s_pemail').value.trim(),
      status: document.getElementById('s_status').value,
      picture: picture || null,
      profileUpdated: existing ? existing.profileUpdated : false,
      phone: existing ? existing.phone : '',
      address: existing ? existing.address : '',
      emergencyContact: existing ? existing.emergencyContact : ''
    };
    
    let isNew = false;
    if(existing) {
      Object.assign(existing, obj);
      audit('Updated student ' + adm);
    } else {
      DB.students.push(obj);
      audit('Added student ' + adm);
      isNew = true;
    }
    saveDB();
    
    const autoAccount = document.getElementById('s_auto_account').value === 'yes';
    if(autoAccount || isNew) {
      const fullName = fn + ' ' + (document.getElementById('s_sn').value.trim() || '');
      const created = createStudentAccount(adm, fullName, obj.class);
      if(created) {
        toast('Student saved. Account created! Username: ' + adm + ', Password: 1234');
      } else if(isNew) {
        toast('Student saved. Account already exists or could not be created.');
      } else {
        toast('Student updated.');
      }
    } else {
      toast('Student saved.');
    }
    renderStudents();
  };
  
  if(fileInput.files && fileInput.files[0]) {
    resizeImage(fileInput.files[0], 300, (dataUrl) => {
      saveStudent(dataUrl);
    });
  } else {
    saveStudent(pictureData);
  }
}

function deleteStudent(adm) {
  if(!confirm('Delete student ' + adm + '?')) return;
  DB.students = DB.students.filter(s => s.admissionNo !== adm);
  if(confirm('Also delete the student\'s login account?')) {
    DB.users = DB.users.filter(u => u.username !== adm);
  }
  audit('Deleted student ' + adm);
  saveDB();
  renderStudents();
}

function createStudentAccountNow(adm) {
  const s = DB.students.find(st => st.admissionNo === adm);
  if(!s) { toast('Student not found.', true); return; }
  if(DB.users.find(u => u.username === adm)) {
    toast('Account already exists.', true);
    return;
  }
  const fullName = s.firstName + ' ' + (s.surname || '');
  const created = createStudentAccount(adm, fullName, s.class);
  if(created) {
    toast('Account created! Username: ' + adm + ', Password: 1234');
    filterStudentsTable();
  } else {
    toast('Failed to create account.', true);

}

  Array.from(document.getElementById('t_roles').options).forEach(o => o.selected = roles.includes(o.value));

  document.getElementById('t_editid').value = id;
  loadTeacherForEdit();
}

function addTeacher() {
  const id = document.getElementById('t_id').value.trim();
  if(!id) { toast('Staff ID required.', true); return; }
  const name = document.getElementById('t_name').value.trim();
  if(!name) { toast('Name required.', true); return; }
  
  const roles = Array.from(document.getElementById('t_roles').selectedOptions).map(o => o.value);
  const primaryRole = roles.length ? roles[0] : 'staff';
  const subjects = Array.from(document.getElementById('t_subjects').selectedOptions).map(o => o.value);
  const assignedClass = document.getElementById('t_class').value;
  
  const existing = DB.teachers.find(t => t.staffId === id);
  const obj = {
    staffId: id,
    name,
    gender: document.getElementById('t_gender').value,
    phone: document.getElementById('t_phone').value.trim(),
    roles,
    role: primaryRole,
    subjects,
    assignedClass
  };
  
  if(existing) {
    Object.assign(existing, obj);
    audit('Updated teacher ' + id);
  } else {
    DB.teachers.push(obj);
    audit('Added teacher ' + id);
  }
  
  let user = DB.users.find(u => u.username === id);
  if(user) {
    user.role = primaryRole;
    user.roles = roles;
    user.fullName = name;
    user.subjects = subjects;
    user.assignedClass = assignedClass;
    user.isStudent = false;
  } else {
    DB.users.push({
      username: id,
      password: '1234',
      role: primaryRole,
      roles,
      fullName: name,
      staffId: id,
      subjects,
      assignedClass,
      isStudent: false
    });
  }
  saveDB();
  toast('Teacher saved.');
  renderTeachers();
}

function deleteTeacher(id) {
  if(!confirm('Delete teacher ' + id + '?')) return;
  DB.teachers = DB.teachers.filter(t => t.staffId !== id);

  saveDB();
  renderTeachers();

function refillSubjectsForClass() {

function loadScoreSheet() {
  const cls = document.getElementById('sc_class').value;
  const arm = document.getElementById('sc_arm').value;
  const subj = document.getElementById('sc_subject').value;
  if(!subj) { toast('Select a subject.', true); return; }
  
  const list = studentsIn(cls, arm);
  const existing = {};
  DB.scores.filter(s => s.session === DB.settings.session && s.term === DB.settings.term && s.class === cls && s.arm === arm && s.subject === subj)
    .forEach(s => existing[s.admissionNo] = s);
  
  const approvalKey = DB.settings.session + '|' + DB.settings.term + '|' + cls + '|' + arm + '|' + subj;
  const isApproved = DB.scoreApprovals && DB.scoreApprovals[approvalKey] && DB.scoreApprovals[approvalKey].approved;
  const canEdit = !isApproved && (CURRENT_USER_ROLE === 'admin' || CURRENT_USER_ROLE === 'exams' || 
    (CURRENT_USER_ROLE === 'staff' || CURRENT_USER_ROLE === 'formmaster'));
  const editable = canEdit ? '' : 'disabled';
  const warn = isApproved ? '<div class="warn-box">⚠️ These scores have been approved and cannot be edited.</div>' : '';
  
  document.getElementById('scoreSheetPanel').innerHTML = `
    <h3>${cls} ${arm || ''} — ${DB.subjects.find(s => s.code === subj)?.name || subj}</h3>
    ${warn}
    <div class="table-wrap"><table><thead><tr><th>Adm</th><th>Student</th><th>CA1 (10)</th><th>CA2 (10)</th><th>CA3 (10)</th><th>Exam (${DB.settings.examMax})</th><th>Total</th><th>Grade</th></tr></thead>
    <tbody>
    ${list.map(s => {
      const e = existing[s.admissionNo] || {};
      return `<tr data-adm="${s.admissionNo}">
        <td>${esc(s.admissionNo)}</td><td>${esc(s.firstName)} ${esc(s.surname)}</td>
        <td><input type="number" min="0" max="10" value="${e.ca1 ?? ''}" style="width:55px" onchange="calcRow(this)" ${editable}></td>
        <td><input type="number" min="0" max="10" value="${e.ca2 ?? ''}" style="width:55px" onchange="calcRow(this)" ${editable}></td>
        <td><input type="number" min="0" max="10" value="${e.ca3 ?? ''}" style="width:55px" onchange="calcRow(this)" ${editable}></td>
        <td><input type="number" min="0" max="${DB.settings.examMax}" value="${e.exam ?? ''}" style="width:55px" onchange="calcRow(this)" ${editable}></td>
        <td class="totalCell">${e.total ?? '-'}</td><td class="gradeCell">${e.grade ?? '-'}</td>
      </tr>`;
    }).join('') || `<tr><td colspan="8" class="empty">No students in this class/arm.</td></tr>`}
    </tbody></table></div>
    ${list.length && canEdit ? `<button class="btn" style="margin-top:12px" onclick="saveScoreSheet('${cls}','${arm}','${subj}')">Save Scores</button>` : ''}
    ${list.length ? `<button class="btn ghost" style="margin-top:12px" onclick="printScoreSheetTemplate('${cls}','${arm}','${subj}')">📄 Print Score Sheet</button>` : ''}
  `;
}

function calcRow(input) {
  const tr = input.closest('tr');
  const ca1 = Number(tr.children[2].querySelector('input').value || 0);
  const ca2 = Number(tr.children[3].querySelector('input').value || 0);
  const ca3 = Number(tr.children[4].querySelector('input').value || 0);
  const exam = Number(tr.children[5].querySelector('input').value || 0);
  if(ca1 > 10 || ca2 > 10 || ca3 > 10) { toast('CA max is 10 each', true); return; }
  if(exam > DB.settings.examMax) { toast('Exam max is ' + DB.settings.examMax, true); return; }
  const total = ca1 + ca2 + ca3 + exam;
  const g = gradeFor(total);
  tr.querySelector('.totalCell').textContent = total;
  tr.querySelector('.gradeCell').textContent = g.grade;
}

function saveScoreSheet(cls, arm, subj) {
  const rows = document.querySelectorAll('#scoreSheetPanel tbody tr[data-adm]');
  let saved = 0;
  rows.forEach(tr => {
    const adm = tr.dataset.adm;
    const ca1 = Number(tr.children[2].querySelector('input').value || 0);
    const ca2 = Number(tr.children[3].querySelector('input').value || 0);
    const ca3 = Number(tr.children[4].querySelector('input').value || 0);
    const exam = Number(tr.children[5].querySelector('input').value || 0);
    if(ca1 === 0 && ca2 === 0 && ca3 === 0 && exam === 0) return;
    const total = ca1 + ca2 + ca3 + exam;
    const g = gradeFor(total);
    const idx = DB.scores.findIndex(s => s.session === DB.settings.session && s.term === DB.settings.term && s.class === cls && s.arm === arm && s.subject === subj && s.admissionNo === adm);
    const rec = { session: DB.settings.session, term: DB.settings.term, class: cls, arm: arm, subject: subj, admissionNo: adm, ca1, ca2, ca3, exam, total, grade: g.grade, remark: g.remark };
    if(idx >= 0) DB.scores[idx] = rec;
    else DB.scores.push(rec);
    saved++;
  });
  audit('Saved ' + saved + ' scores');
  saveDB();
  toast(saved + ' scores saved.');
  loadScoreSheet();
}

  const list = studentsIn(cls, arm);

  let html = `

function downloadTemplate(type) {
  let headers, filename;
  if(type === 'students') {
    headers = 'admissionNo,firstName,middleName,surname,gender,dob,class,arm,parentName,parentPhone,status,picture';
    filename = 'student_template.csv';
  } else {
    headers = 'admissionNo,class,arm,subject,ca1,ca2,ca3,exam';
    filename = 'score_template.csv';
  }
  const blob = new Blob([headers + '\n'], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim().length);
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const cells = line.split(',').map(c => c.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = cells[i] || '');
    return obj;
  });
}

let PENDING_IMPORT = null;

function previewCSV(type) {
  const fileInput = document.getElementById(type === 'students' ? 'stuFile' : 'scoreFile');
  if(!fileInput.files.length) { toast('Choose a CSV file.', true); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const rows = parseCSV(e.target.result);
    const errors = [];
    const valid = [];
    
    if(type === 'students') {
      const admSet = new Set(DB.students.map(s => s.admissionNo));
      rows.forEach((r, i) => {
        const errs = [];
        if(!r.admissionNo) errs.push('missing admissionNo');
        else if(admSet.has(r.admissionNo)) errs.push('duplicate admissionNo');
        if(!r.firstName) errs.push('missing firstName');
        if(r.class && !DB.classes.some(c => c.name === r.class)) errs.push('unknown class');
        if(errs.length) { errors.push({ row: i + 2, issue: errs.join(', ') }); }
        else { admSet.add(r.admissionNo); valid.push({ ...r }); }
      });
    } else {
      rows.forEach((r, i) => {
        const errs = [];
        const stu = DB.students.find(s => s.admissionNo === r.admissionNo);
        if(!r.admissionNo || !stu) errs.push('unknown admissionNo');
        const subj = DB.subjects.find(s => String(s.code).trim().toLowerCase() === String(r.subject || '').trim().toLowerCase());
        if(!subj) errs.push('unknown subject code');
        const ca1 = Number(r.ca1), ca2 = Number(r.ca2), ca3 = Number(r.ca3), exam = Number(r.exam);
        if(isNaN(ca1) || ca1 < 0 || ca1 > 10) errs.push('CA1 out of range');
        if(isNaN(ca2) || ca2 < 0 || ca2 > 10) errs.push('CA2 out of range');
        if(isNaN(ca3) || ca3 < 0 || ca3 > 10) errs.push('CA3 out of range');
        if(isNaN(exam) || exam < 0 || exam > DB.settings.examMax) errs.push('Exam out of range');
        if(errs.length) { errors.push({ row: i + 2, issue: errs.join(', ') }); }
        else { valid.push({ ...r, subject: subj.code, class: stu.class, arm: stu.arm }); }
      });
    }
    
    PENDING_IMPORT = { type, valid, errors, rows };
    const target = document.getElementById(type === 'students' ? 'stuPreview' : 'scorePreview');
    target.innerHTML = `
      <div class="warn-box">Total: ${rows.length} • Valid: ${valid.length} • Errors: ${errors.length}</div>
      ${errors.length ? `<div class="table-wrap"><table><thead><tr><th>Row</th><th>Issue</th></tr></thead><tbody>${errors.map(e => `<tr><td>${e.row}</td><td>${e.issue}</td></tr>`).join('')}</tbody></table></div>` : ''}
      <button class="btn green" style="margin-top:10px" onclick="commitImport('${type}')">Import ${valid.length} Records</button>
      <button class="btn ghost" onclick="PENDING_IMPORT=null;document.getElementById('${type === 'students' ? 'stuPreview' : 'scorePreview'}').innerHTML=''">Cancel</button>
    `;
  };
  reader.readAsText(fileInput.files[0]);
}

function commitImport(type) {
  if(!PENDING_IMPORT || PENDING_IMPORT.type !== type) return;
  const { valid, rows, errors } = PENDING_IMPORT;
  
  if(type === 'students') {
    let accountCreated = 0;
    valid.forEach(r => {
      const student = {
        admissionNo: r.admissionNo,
        firstName: r.firstName,
        middleName: r.middleName || '',
        surname: r.surname || '',
        gender: r.gender || 'Male',
        dob: r.dob || '',
        class: r.class || '',
        arm: r.arm || '',
        parentName: r.parentName || '',
        parentPhone: r.parentPhone || '',
        status: r.status || 'Active',
        picture: r.picture || null,
        profileUpdated: false,
        phone: '',
        address: '',
        emergencyContact: ''
      };
      DB.students.push(student);
      const fullName = r.firstName + ' ' + (r.surname || '');
      const created = createStudentAccount(r.admissionNo, fullName, r.class);
      if(created) accountCreated++;
    });
    if(accountCreated > 0) {
      toast(valid.length + ' students imported. ' + accountCreated + ' accounts created with password 1234.');
    } else {
      toast(valid.length + ' students imported.');
    }
  } else {
    valid.forEach(r => {
      const ca1 = Number(r.ca1), ca2 = Number(r.ca2), ca3 = Number(r.ca3), exam = Number(r.exam);
      const total = ca1 + ca2 + ca3 + exam;
      const g = gradeFor(total);
      const idx = DB.scores.findIndex(s => s.session === DB.settings.session && s.term === DB.settings.term && s.class === r.class && s.arm === r.arm && s.subject === r.subject && s.admissionNo === r.admissionNo);
      const rec = { session: DB.settings.session, term: DB.settings.term, class: r.class, arm: r.arm, subject: r.subject, admissionNo: r.admissionNo, ca1, ca2, ca3, exam, total, grade: g.grade, remark: g.remark };
      if(idx >= 0) DB.scores[idx] = rec;
      else DB.scores.push(rec);
    });
    toast(valid.length + ' scores imported.');
  }
  
  DB.importHistory.unshift({
    date: new Date().toLocaleString(),
    module: type === 'students' ? 'Bulk Students' : 'Bulk Scores',
    total: rows.length,
    imported: valid.length,
    errors: errors.length
  });
  audit('Bulk imported ' + valid.length + ' ' + type);
  saveDB();
  PENDING_IMPORT = null;
  renderBulk();
}

function approveScores(cls, arm, subj) {

function unapproveScores(cls, arm, subj) {

function showPromotionPreview() {
  const classList = DB.classes.map(c => c.name);
  const nextClassMap = {};
  for(let i = 0; i < classList.length; i++) {
    if(i < classList.length - 1) nextClassMap[classList[i]] = classList[i + 1];
    else nextClassMap[classList[i]] = classList[i];
  }
  const repeatAdms = (document.getElementById('ro_repeat')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
  const activeStudents = DB.students.filter(s => s.status === 'Active');
  let html = '';
  activeStudents.forEach(s => {
    const repeat = repeatAdms.includes(s.admissionNo);
    const newClass = repeat ? s.class : (nextClassMap[s.class] || s.class);
    html += `<tr><td>${esc(s.admissionNo)}</td><td>${esc(s.firstName)} ${esc(s.surname)}</td>
      <td>${esc(s.class)}${s.arm ? ' ' + esc(s.arm) : ''}</td>
      <td>${esc(newClass)}${s.arm ? ' ' + esc(s.arm) : ''}</td>
      <td>${repeat ? '<span class="pill bad">Repeat</span>' : '<span class="pill ok">Promote</span>'}</td></tr>`;
  });
  document.getElementById('promotionPreview').innerHTML = html || '<tr><td colspan="5" class="empty">No active students.</td></tr>';
}

function rolloverWithPromotion() {
  let ns = document.getElementById('ro_session_new').value.trim();
  const sel = document.getElementById('ro_session_select').value;
  if(sel === '__new__' && !ns) { toast('Enter new session name.', true); return; }
  if(sel && sel !== '__new__') ns = sel;
  if(!ns) { toast('Select or enter session name.', true); return; }
  if(!confirm('Move to ' + ns + ' and promote students? This action cannot be undone easily.')) return;
  if(!DB.sessions.includes(ns)) DB.sessions.push(ns);
  
  const classList = DB.classes.map(c => c.name);
  const nextClassMap = {};
  for(let i = 0; i < classList.length; i++) {
    if(i < classList.length - 1) nextClassMap[classList[i]] = classList[i + 1];
    else nextClassMap[classList[i]] = classList[i];
  }
  const repeatAdms = (document.getElementById('ro_repeat').value || '').split(',').map(s => s.trim()).filter(Boolean);
  
  DB.students.forEach(s => {
    if(s.status === 'Active') {
      if(repeatAdms.includes(s.admissionNo)) {
        audit('Student ' + s.admissionNo + ' repeating ' + s.class);
      } else {
        const newClass = nextClassMap[s.class] || s.class;
        if(newClass !== s.class) {
          audit('Student ' + s.admissionNo + ' promoted from ' + s.class + ' to ' + newClass);
          s.class = newClass;
        }
      }
    }
  });
  
  DB.settings.session = ns;
  DB.settings.term = document.getElementById('ro_term').value;
  DB.scoreApprovals = {};
  audit('Session rolled over to ' + ns + ' with promotions');
  saveDB();
  toast('Now on session ' + ns + ' with promotions applied.');
  go('dashboard');
}

      grandTotal += rowTotal;
      grandCount += rowCount;
    });
    const overallAvg = grandCount > 0 ? (grandTotal / grandCount) : 0;
    const overallGrade = gradeFor(overallAvg);
    html += `<tr style="font-weight:700;background:#e8edf4;"><td>OVERALL</td>`;
    termNames.forEach(t => {
      const termTotal = allRows.filter(r => r._term === t).reduce((n, r) => n + r.total, 0);
      html += `<td>${termTotal}</td>`;
    });
    html += `<td>${grandTotal}</td><td>${overallAvg.toFixed(1)}</td><td>${overallGrade.grade}</td></tr>`;
    html += `</tbody></table></div>`;
    
    html += `<div class="row" style="margin-top:14px">
      <div><strong>Total:</strong> ${grandTotal}</div>
      ${rsf.average !== false ? `<div><strong>Overall Average:</strong> ${overallAvg.toFixed(1)}</div>` : ''}
      ${rsf.position !== false ? `<div><strong>Position:</strong> ${pos.position} of ${classSize}</div>` : ''}
      <div><strong>Subjects:</strong> ${subjects.length}</div>
    </div>`;
  } else {
    html += `<div class="table-wrap"><table><thead><tr><th>Subject</th><th>CA1</th><th>CA2</th><th>CA3</th><th>Exam</th><th>Total</th>${rsf.grade !== false ? '<th>Grade</th>' : ''}${rsf.remark !== false ? '<th>Remark</th>' : ''}</tr></thead>
    <tbody>`;
    let totalSum = 0;
    allRows.forEach(r => {
      totalSum += r.total;
      html += `<tr><td>${esc(DB.subjects.find(s => s.code === r.subject)?.name || r.subject)}</td>
        <td>${r.ca1}</td><td>${r.ca2}</td><td>${r.ca3}</td><td>${r.exam}</td><td>${r.total}</td>
        ${rsf.grade !== false ? `<td>${r.grade}</td>` : ''}
        ${rsf.remark !== false ? `<td>${r.remark}</td>` : ''}
      </tr>`;
    });
    html += `</tbody></table></div>`;
    
    const avgSingle = allRows.length ? totalSum / allRows.length : 0;
    html += `<div class="row" style="margin-top:14px">
      <div><strong>Total:</strong> ${totalSum}</div>
      ${rsf.average !== false ? `<div><strong>Average:</strong> ${avgSingle.toFixed(1)}</div>` : ''}
      ${rsf.position !== false ? `<div><strong>Position:</strong> ${pos.position} of ${classSize}</div>` : ''}
      <div><strong>Subjects:</strong> ${allRows.length}</div>
    </div>`;
  }
  
  html += `
    ${rsf.classTeacherComment !== false ? `<div class="comment-box"><strong>Teacher's Comment:</strong> ${esc(teacherComment)}
      <button class="btn ghost sm no-print" style="margin-left:8px" onclick="editComment('${key}','teacher')">Edit</button></div>` : ''}
    ${rsf.headmasterComment !== false ? `<div class="comment-box"><strong>Headmaster's Comment:</strong> ${esc(headComment)}
      <button class="btn ghost sm no-print" style="margin-left:8px" onclick="editComment('${key}','head')">Edit</button></div>` : ''}
    ${DB.settings.nextTermBegins ? `<div style="margin-top:14px;font-size:12.5px"><strong>Next Term Begins:</strong> ${formatDate(DB.settings.nextTermBegins)}</div>` : ''}
    <div class="sig-row">
      <div>${DB.settings.teacherSignature ? `<img src="${DB.settings.teacherSignature}">` : ''}Teacher's Signature</div>
      <div>${DB.settings.headmasterSignature ? `<img src="${DB.settings.headmasterSignature}">` : ''}Headmaster's Signature</div>
    </div>
  </div>`;
  return html;
}

function formatDate(iso) {
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
}

function autoTeacherComment(avg) {
  if(avg >= 80) return "Outstanding result. Keep it up!";
  if(avg >= 70) return "Very good. Stay focused.";
  if(avg >= 60) return "Good. More effort yields more.";
  if(avg >= 50) return "Fair. More commitment needed.";
  if(avg >= 40) return "Satisfactory but room for improvement.";
  return "Needs significant improvement. See me.";
}

function autoHeadComment(avg) {
  if(avg >= 80) return "Excellent performance.";
  if(avg >= 70) return "Very good. Keep working.";
  if(avg >= 60) return "Good. Aim higher.";
  if(avg >= 50) return "Fair. Greater effort required.";
  if(avg >= 40) return "Satisfactory. Improve.";
  return "Needs significant improvement.";
}

function classPositions(cls, arm) {
  const list = studentsIn(cls, arm);
  const totals = list.map(s => {
    const rows = DB.scores.filter(sc => sc.session === DB.settings.session && sc.term === DB.settings.term && sc.class === cls && sc.arm === arm && sc.admissionNo === s.admissionNo);
    const sum = rows.reduce((n, r) => n + r.total, 0);
    return { admissionNo: s.admissionNo, sum, count: rows.length };
  });
  totals.sort((a, b) => b.sum - a.sum);
  let pos = 0, lastSum = null, positions = {};
  totals.forEach((t, i) => {
    if(t.sum !== lastSum) { pos = i + 1; lastSum = t.sum; }
    positions[t.admissionNo] = { position: pos, sum: t.sum, count: t.count };
  });
  return positions;
}

function addFee() {
  const adm = document.getElementById('f_adm').value.trim();
  if(!DB.students.some(s => s.admissionNo === adm)) { toast('Unknown admission number.', true); return; }
  const idx = document.getElementById('f_editid').value.trim();

    f.admissionNo = adm;
    f.type = document.getElementById('f_type').value.trim() || 'Fee';

    f.paid = Number(document.getElementById('f_paid').value || 0);

    toast('Fee updated.');
    renderFees();

  DB.fees.push({

    type: document.getElementById('f_type').value.trim() || 'Fee',

    paid: Number(document.getElementById('f_paid').value || 0),

  saveDB();
  toast('Fee saved.');
  renderFees();
}

      if(!classGroups[key]) classGroups[key] = { class: s.class, arm: s.arm || '', expected: 0, paid: 0, students: new Set() };

      classGroups[key].paid += f.paid;
      classGroups[key].students.add(s.admissionNo);
    }
  });
  
  html += `<div class="table-wrap"><table><thead><tr><th>Class</th><th>Arm</th><th>Students</th><th>Total Expected</th><th>Total Paid</th><th>Outstanding</th></tr></thead><tbody>`;

function generateFullTimetable() {
  const days = Array.from(document.getElementById('tt_days').selectedOptions).map(o => o.value);
  const sessions = Array.from(document.getElementById('tt_sessions').selectedOptions).map(o => o.value);
  const periodsPerSession = parseInt(document.getElementById('tt_periods').value) || 4;
  const minutesPerPeriod = parseInt(document.getElementById('tt_minutes').value) || 45;
  
  if(!days.length) { toast('Select at least one day.', true); return; }
  if(!sessions.length) { toast('Select at least one session.', true); return; }
  
  const classList = classArmList();
  if(!classList.length) { toast('No classes available.', true); return; }
  
  let html = `<div class="no-print"><button class="btn" onclick="printTimetables()">🖨️ Print All</button></div>`;
  
  classList.forEach(({ cls, arm }, classIdx) => {
    const subs = classSubjects(cls);
    if(!subs.length) {
      html += `<div class="panel" style="border:2px solid var(--red);">
        <h3>${esc(cls)} ${arm || ''} - No subjects assigned!</h3>
        <p class="muted">Please assign subjects to this class first.</p>
      </div>`;
      return;
    }
    
    const savedKey = cls + '|' + arm;
    let savedData = DB.timetables ? DB.timetables[savedKey] : null;
    let ttData = savedData ? savedData : null;
    
    if(!ttData) {
      ttData = generateTimetableData(cls, arm, subs, days, sessions, periodsPerSession, minutesPerPeriod);
    }
    
    let ttHtml = buildTimetableHTML(cls, arm, ttData, days, sessions, periodsPerSession, minutesPerPeriod, subs);
    html += ttHtml;
    if(classIdx < classList.length - 1) html += '<div class="page-break"></div>';
  });
  
  document.getElementById('timetableOut').innerHTML = html;
  window._timetableContent = html;
}

function generateTimetableData(cls, arm, subs, days, sessions, periodsPerSession, minutesPerPeriod) {
  const shuffled = [...subs];
  for(let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  
  const timetable = {};
  days.forEach(day => {
    timetable[day] = {};
    sessions.forEach(session => {
      timetable[day][session] = [];
      for(let p = 0; p < periodsPerSession; p++) {
        const subIdx = (p * days.length * sessions.length + day.length + session.length + p) % shuffled.length;
        const sub = shuffled[subIdx];
        timetable[day][session].push({ subject: sub.code, name: sub.name });
      }
    });
  });
  return { days, sessions, periodsPerSession, minutesPerPeriod, timetable, class: cls, arm: arm };
}

function buildTimetableHTML(cls, arm, ttData, days, sessions, periodsPerSession, minutesPerPeriod, subs) {
  const safeCls = cls.replace(/[^a-zA-Z0-9]/g, '_') + '_' + arm.replace(/[^a-zA-Z0-9]/g, '_');
  
  let html = `
  <div class="panel timetable-print" style="page-break-after:always;">

      ${DB.settings.logo ? `<img src="${DB.settings.logo}" style="height:40px;display:block;margin:0 auto 4px;">` : ''}
      <h2 style="color:#fff;margin:0;">${esc(DB.settings.schoolName)}</h2>
      <h3 style="color:#fff;margin-top:8px;">📅 TIMETABLE - ${esc(cls)} ${esc(arm || '')}</h3>
      <div style="color:#d6e3f5;">Session: ${esc(DB.settings.session)}</div>
      <div style="color:#d6e3f5;">${periodsPerSession} periods per session • ${minutesPerPeriod} min each</div>
    </div>
    <div style="margin-bottom:10px;font-size:12px;color:var(--muted);">
      <strong>Subjects:</strong> ${subs.map(s => esc(s.name)).join(', ')}
    </div>
    <div class="table-wrap">
      <table class="timetable-grid">
        <thead>
          <tr><th style="min-width:80px;">Time / Day</th>${days.map(d => `<th>${esc(d)}</th>`).join('')}</tr>
        </thead>
        <tbody>
  `;
  
  let periodTimes = [];
  for(let p = 0; p < periodsPerSession; p++) {
    periodTimes.push(`Period ${p + 1}`);
  }
  
  sessions.forEach((session, si) => {
    html += `<tr><td class="session-label" colspan="${days.length + 1}">${esc(session.toUpperCase())} SESSION</td></tr>`;
    periodTimes.forEach((period, pIdx) => {
      html += `<tr><td class="time-col">${period}</td>`;
      days.forEach(day => {
        const cell = ttData.timetable[day]?.[session]?.[pIdx];
        const subjectName = cell ? cell.name : '-';
        html += `<td>
          <input type="text" class="timetable-edit-input" 
                 data-cls="${safeCls}" data-day="${day}" data-session="${session}" data-period="${pIdx}"
                 value="${esc(subjectName)}" 
                 onchange="updateTimetableCell(this)" 
                 placeholder="Subject">
        </td>`;
      });
      html += `</tr>`;
    });
  });
  
  html += `
        </tbody>
      </table>
    </div>
    <div style="margin-top:14px;font-size:11px;color:var(--muted);">
      <div><strong>Total Subjects:</strong> ${subs.length} • <strong>Periods per Day:</strong> ${periodsPerSession * sessions.length}</div>
      <div>Generated on: ${new Date().toLocaleString()}</div>
    </div>
    <div class="sig-row" style="margin-top:20px;">
      <div>${DB.settings.headmasterSignature ? `<img src="${DB.settings.headmasterSignature}">` : ''}Headmaster</div>
      <div>${DB.settings.teacherSignature ? `<img src="${DB.settings.teacherSignature}">` : ''}Exams Officer</div>
    </div>
  </div>`;
  return html;
}

      classData[cls] = { days: [], sessions: [], periodsPerSession: 0, minutesPerPeriod: 0, timetable: {} };
    }
    if(!classData[cls].timetable[day]) classData[cls].timetable[day] = {};
    if(!classData[cls].timetable[day][session]) classData[cls].timetable[day][session] = [];
    classData[cls].timetable[day][session][period] = { subject: 'CUSTOM', name: value };
  });
  
  const days = Array.from(document.getElementById('tt_days').selectedOptions).map(o => o.value);
  const sessions = Array.from(document.getElementById('tt_sessions').selectedOptions).map(o => o.value);
  const periodsPerSession = parseInt(document.getElementById('tt_periods').value) || 4;
  const minutesPerPeriod = parseInt(document.getElementById('tt_minutes').value) || 45;
  
  if(!DB.timetables) DB.timetables = {};
  
  const classList = classArmList();
  Object.keys(classData).forEach(key => {
    const match = classList.find(({ cls, arm }) => {
      const safe = cls.replace(/[^a-zA-Z0-9]/g, '_') + '_' + arm.replace(/[^a-zA-Z0-9]/g, '_');
      return safe === key;
    });
    if(match) {
      const dbKey = match.cls + '|' + match.arm;
      DB.timetables[dbKey] = {
        days: days,
        sessions: sessions,
        periodsPerSession: periodsPerSession,
        minutesPerPeriod: minutesPerPeriod,
        timetable: classData[key].timetable,
        class: match.cls,
        arm: match.arm
      };
    }
  });
  
  audit('Saved timetables');
  saveDB();
  toast('Timetables saved successfully!');
}
